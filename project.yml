# 用 xcodegen 生成 DBIBackend.xcodeproj：xcodegen generate
# 源码目录是"同步文件夹"，增删 Swift 文件不需要重新生成工程；只有改了本文件才需要。
name: DBIBackend
options:
  bundleIdPrefix: work.xiaolin
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  DBIBackend:
    type: application
    platform: macOS
    sources:
      - path: DBIBackend
        type: syncedFolder
    info:
      # 不放在 DBIBackend/ 下：那是同步文件夹，Info.plist 会被当成资源拷进包里
      path: Config/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.xiaolin.DBIBackend
        PRODUCT_NAME: DBI Backend
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DBI Backend
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Xiaolin"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: DBIBackend/Resources/DBIBackend.entitlements
        # 用 Apple Development 证书：签名身份每次构建都一样，macOS 的「允许配件连接」只问一次
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: YWQ4TY4VR5
  DBIBackendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        type: syncedFolder
    dependencies:
      - target: DBIBackend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.xiaolin.DBIBackendTests
        # XCTest 本身要求 macOS 14
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DBI Backend.app/Contents/MacOS/DBI Backend"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: YWQ4TY4VR5
schemes:
  DBIBackend:
    build:
      targets:
        DBIBackend: all
        DBIBackendTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DBIBackendTests
